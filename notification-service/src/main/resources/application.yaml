server:
  port: 8082

spring:
  application:
    name: notification-service
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms

  datasource:
    url: jdbc:postgresql://localhost:5432/shobbe_notification?currentSchema=ecommerce_notification
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_AUTO_STARTUP:false}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fasterxml.jackson.databind.JsonNode

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:candyyeukoi10@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-secret: 3qvYc8T4vL1VYwKp8xZ2M6rQ9bNfD7uHcJkR5tP1eWmXg2ZsY8aC4vN7LqB0dFhKc2T9wE6rUjM5xPzA1sD3Gh8K0Q==

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  rabbitmq:
    exchange:
      auth: ${RABBITMQ_AUTH_EXCHANGE:shobbe.auth.exchange}
      dlx: ${RABBITMQ_AUTH_DLX:shobbe.auth.dlx}
    queues:
      registration:
        name: ${RABBITMQ_REGISTRATION_QUEUE:shobbe.auth.registration.queue}
        routing-key: ${RABBITMQ_REGISTRATION_ROUTING_KEY:shobbe.auth.registration.key}
        dlq-name: ${RABBITMQ_REGISTRATION_DLQ:shobbe.auth.registration.dlq}
        dlq-routing-key: ${RABBITMQ_REGISTRATION_DLQ_KEY:shobbe.auth.registration.dlq.key}



