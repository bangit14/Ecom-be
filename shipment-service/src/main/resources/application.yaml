server:
  port: 8086

spring:
  application:
    name: shipment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shobbe_shipment?currentSchema=ecommerce_shipment
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ecommerce_shipment
    default-schema: ecommerce_shipment
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

app:
  rabbitmq:
    exchange:
      shipment: shobbe.shipment.exchange
      dlx: shobbe.shipment.dlx
    queues:
      order-shipment:
        name: shobbe.order.shipment.queue
        routing-key: shobbe.order.shipment.key
        dlq-name: shobbe.order.shipment.dlq
        dlq-routing-key: shobbe.order.shipment.dlq.key
      status-updated:
        name: shobbe.shipment.status.queue
        routing-key: shobbe.shipment.status.key
        dlq-name: shobbe.shipment.status.dlq
        dlq-routing-key: shobbe.shipment.status.dlq.key

