server:
  port: 8083

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shobbe_product?currentSchema=ecommerce_product
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ecommerce_product
    default-schema: ecommerce_product
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-underline: true
      id-type: auto

# MinIO Configuration
