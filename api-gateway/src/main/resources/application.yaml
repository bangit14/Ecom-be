server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:1412"
                  - "http://127.0.0.1:1412"
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # Auth & Identity Service
            - id: auth-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/auth/**, /api/users/**, /api/addresses/**, /api/stores/**, /api/account/**

            # Product, Review & Wishlist Service
            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/products/**, /api/categories/**, /api/reviews/**, /api/admin/reviews/**, /api/wishlists/**

            # Order & Cart Service
            - id: order-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/orders/**, /api/carts/**

            # Notification Service
            - id: notification-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/notifications/**

            # Report & Analytics Service
            - id: report-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/admin/reports/**

            # Shipment & Logistics Service
            - id: shipment-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/shipments/**, /api/shipping-providers/**, /api/shipping-rates/**, /api/shipping-addresses/**

